      <path d="M27 181V209M57 181V209M87 181V209M117 181V209M147 181V209M177 181V209M207 181V209"/>
      <path d="M23 28H-5M23 58H-5M23 88H-5M23 118H-5M23 148H-5M23 178H-5"/>
      <path d="M207 28H235M207 58H235M207 88H235M207 118H235M207 148H235M207 178H235"/>
    </g>
    <rect x="39" y="35" width="152" height="134" rx="9" fill="url(#chip)" stroke="#22d3ee" stroke-width="2"/>
    <rect x="53" y="49" width="124" height="106" rx="5" fill="#0b1a2b" stroke="#38bdf8" stroke-opacity=".5"/>
